version: '3.8'

services:
  ollama:
    build: .
    container_name: ollama-sandbox
    restart: unless-stopped

    # Resource limits - prevent overheating
    # 25G allows 18GB model + overhead for inference
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 25G
        reservations:
          memory: 16G

    # File descriptor limits for streaming
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    # Port mapping - only localhost access
    ports:
      - "127.0.0.1:11434:11434"

    # Volume mounts with strict permissions
    volumes:
      # Ollama models and state (persistent)
      - ollama-data:/data/.ollama

      # Read-only context repos (for potential RAG/context)
      # Use ${HOME} for proper path expansion
      - ${HOME}/Gits/zikaron:/data/zikaron:ro
      - ${HOME}/Gits/claude-golem:/data/claude-golem:ro
      - ${HOME}/Gits/golems-zikaron:/data/golems-zikaron:ro

      # Write access for songscript output only
      - ${HOME}/Gits/songscript:/data/songscript:rw

    # Network isolation - no egress
    networks:
      - ollama-internal

    # Security options
    security_opt:
      - no-new-privileges:true

    # Environment
    environment:
      - OLLAMA_HOME=/data/.ollama
      - OLLAMA_MODELS=/data/.ollama/models
      - OLLAMA_HOST=127.0.0.1:11434

  # Nginx proxy for request logging
  proxy:
    image: nginx:alpine
    container_name: ollama-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - proxy-logs:/var/log/nginx
    networks:
      - ollama-internal
    depends_on:
      - ollama

networks:
  ollama-internal:
    driver: bridge
    internal: true  # No external network access

volumes:
  ollama-data:
  proxy-logs:
