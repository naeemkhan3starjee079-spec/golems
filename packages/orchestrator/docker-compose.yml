# n8n + PostgreSQL for content orchestration.
#
# Usage:
#   docker compose up -d          # Start n8n + postgres
#   docker compose down            # Stop
#   docker compose logs -f n8n     # View logs
#
# Requirements:
#   - Docker Desktop or OrbStack
#   - Copy .env.example to .env and fill in secrets
#
# Access: http://localhost:5678

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_secret}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n_secret}

      # Generic
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Jerusalem
      TZ: Asia/Jerusalem

      # Execution
      EXECUTIONS_TIMEOUT: -1  # No timeout (Flux generations take 5-15 min)
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 3  # Prevent GPU exhaustion
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168  # 7 days

      # Binary data — filesystem mode (large images/videos)
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/.n8n/binaryData

      # Metrics
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"

      # Community nodes
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"

      # External services (passed from .env)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Access host services (ComfyUI on 8188, render service on 3001)
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  n8n_data:
