# DeepSource Configuration for Golems Monorepo
# See: https://deepsource.io/docs/configuration.html

version = 1

# Project Type
projectType = "monorepo"

# Test Coverage Analyzer (optional)
[[analyzers]]
name = "test-coverage"
enabled = true
config = {}

# TypeScript/JavaScript Analyzer
[[analyzers]]
name = "javascript"
enabled = true
config = {
  # Bug detection - find common mistakes
  options = {
    "detectBugPatterns" = true,
    # Enable all TypeScript/JavaScript features
    "enforcePrettierStyle" = false,
    # Detect security issues
    "detectSecurityIssues" = true,
    # Detect anti-patterns
    "detectAntiPatterns" = true,
    # Code duplication detection
    "detectDuplication" = true
  }
}

# Python Analyzer (for zikaron package)
[[analyzers]]
name = "python"
enabled = true
config = {
  options = {
    # Bug detection
    "detectBugPatterns" = true,
    # Security issues
    "detectSecurityIssues" = true,
    # Anti-patterns
    "detectAntiPatterns" = true,
    # Code duplication
    "detectDuplication" = true,
    # Lint configuration
    "lint" = {
      # Enable ruff linter (compatible with zikaron's pyproject.toml)
      "enable" = true
    }
  }
}

# Ignore patterns (common in monorepos)
[ignore]
paths = [
  "node_modules/",
  ".venv/",
  "__pycache__/",
  ".git/",
  ".DS_Store",
  "dist/",
  "build/",
  "*.lock",
  ".next/",
  "out/"
]

# Package-specific configuration
[[pathConfigs]]
# Golem packages (TypeScript/Bun workspace)
path = "packages/shared"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/claude"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/jobs"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/recruiter"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/teller"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/coach"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/content"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/services"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/autonomous"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/ralph"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/admin-ui"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/docsite"
analyzers = ["javascript"]

[[pathConfigs]]
path = "packages/tax-helper"
analyzers = ["javascript"]

# Python package
[[pathConfigs]]
path = "packages/zikaron"
analyzers = ["python"]

# Issue Rules (optional - configure issue severity)
[[rules]]
name = "security"
enabled = true

[[rules]]
name = "performance"
enabled = true

[[rules]]
name = "code-quality"
enabled = true

[[rules]]
name = "anti-patterns"
enabled = true
