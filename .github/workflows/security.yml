name: Security Checks

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write
  checks: write

jobs:
  bun-audit:
    name: Bun Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/ralph
          - packages/docsite
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.0.25"

      - name: Install dependencies
        run: bun install

      - name: Run bun audit
        working-directory: ${{ matrix.package }}
        run: bun audit
        continue-on-error: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: pip install trufflehog

      - name: Scan for secrets
        run: |
          trufflehog filesystem . \
            --json \
            --fail \
            --max-depth 3 \
            --include-paths '.*\.(ts|tsx|js|jsx|json|py|yml|yaml)$' \
            --exclude-paths '.*node_modules.*|.*\.git.*|.*dist.*|.*build.*'
        continue-on-error: true

  typescript-lint:
    name: TypeScript Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/ralph
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.0.25"

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        working-directory: ${{ matrix.package }}
        run: bun run type-check
        continue-on-error: true

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [bun-audit, secret-scan, typescript-lint]
    if: always()
    steps:
      - name: Check security status
        run: |
          echo "Security checks completed."
          echo "Review audit results above for any vulnerabilities."
          echo "Failures in audits are non-blocking but should be reviewed."
