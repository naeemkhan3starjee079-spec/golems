version: 2
updates:
  # NPM packages - autonomous
  - package-ecosystem: "npm"
    directory: "/packages/autonomous"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "EtanHey"

